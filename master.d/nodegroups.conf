# /etc/salt/master.d/nodegroups.conf   (restart salt-master after changing)
nodegroups:
  dc1:      'L@spine1,spine2,leaf1,leaf2,leaf3,leaf4,leaf5,dc1-border-leaf'
  dc2:      'L@dc2-border-leaf,dc2-leaf1'
  dc3:      'L@dc3-border-leaf,dc3-leaf1'
  spines:   'L@spine1,spine2'
  leaves:   'L@leaf1,leaf2,leaf3,leaf4,leaf5,dc2-leaf1,dc3-leaf1'
  borders:  'L@dc1-border-leaf,dc2-border-leaf,dc3-border-leaf'
  gateways: 'L@dc1-border-leaf,dc3-border-leaf'           # EVPN multi-domain, EOS 4.36
  switches: 'N@dc1 or N@dc2 or N@dc3'                      # everything the fabric state manages
  routers:  'L@internet-rtr'
  all:      'N@switches or N@routers'
