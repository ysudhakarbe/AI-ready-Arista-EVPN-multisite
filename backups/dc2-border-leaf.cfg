! Command: show running-config
! device: dc2-border-leaf (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc2-border-leaf
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
vrf instance gold
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description dc2-leaf1 Ethernet11
   mtu 9214
   no switchport
   ip address 10.1.1.0/31
!
interface Ethernet2
!
interface Ethernet3
!
interface Ethernet4
   description DCI-to-DC1
   mtu 9214
   no switchport
!
interface Ethernet4.100
   encapsulation dot1q vlan 100
   vrf gold
   ip address 172.16.200.1/31
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   description EVPN router-id
   ip address 10.1.250.15/32
!
interface Loopback1
   description VTEP
   ip address 10.1.255.15/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.233/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf gold vni 100001
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip prefix-list DCI-OUT seq 10 permit 10.0.0.0/8 le 24
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
route-map DCI-OUT permit 10
   match ip address prefix-list DCI-OUT
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65200
   router-id 10.1.250.15
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.1.1.1 peer group underlay
   neighbor 10.1.1.1 remote-as 65201
   neighbor 10.1.1.1 description dc2-leaf1-underlay
   neighbor 10.1.250.11 peer group evpn
   neighbor 10.1.250.11 remote-as 65201
   neighbor 10.1.250.11 description dc2-leaf1-EVPN-Lo0
   !
   address-family evpn
      neighbor evpn activate
   !
   address-family ipv4
      neighbor underlay activate
      network 10.1.250.15/32
      network 10.1.255.15/32
   !
   vrf gold
      rd 10.1.250.15:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      neighbor 172.16.200.0 remote-as 65003
      neighbor 172.16.200.0 description DC1-BL-gold
      neighbor 172.16.200.0 route-map DCI-OUT out
      !
      address-family ipv4
         neighbor 172.16.200.0 activate
!
management ssh
   vrf MGMT
      no shutdown
!
end
