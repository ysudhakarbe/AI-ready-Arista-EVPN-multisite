! Command: show running-config
! device: dc1-border-leaf (vEOS-lab, EOS-4.36.3M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname dc1-border-leaf
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 40
   name APP-40
!
vrf instance MGMT
!
vrf instance gold
!
interface Ethernet1
   description spine1 Ethernet4
   mtu 9214
   no switchport
   ip address 10.0.1.9/31
!
interface Ethernet2
   description spine2 Ethernet4
   mtu 9214
   no switchport
   ip address 10.0.2.9/31
!
interface Ethernet3
   description internet-router
   no switchport
   vrf gold
   ip address 172.16.100.0/31
!
interface Ethernet4
   description DCI-to-DC2
   mtu 9214
   no switchport
!
interface Ethernet4.100
   encapsulation dot1q vlan 100
   vrf gold
   ip address 172.16.200.0/31
!
interface Ethernet5
   description METRO-EVPN-DCI-to-dc3-border-leaf Ethernet5
   mtu 9214
   no switchport
   ip address 172.16.230.0/31
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   description EVPN router-id
   ip address 10.0.250.15/32
!
interface Loopback1
   description VTEP
   ip address 10.0.255.15/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.226/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 40 vni 110040
   vxlan vrf gold vni 100001
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip prefix-list DCI-OUT seq 10 permit 0.0.0.0/0
ip prefix-list DCI-OUT seq 20 permit 10.0.0.0/8 le 24
ip prefix-list DCI-UNDERLAY-OUT seq 10 permit 10.0.250.15/32
ip prefix-list DCI-UNDERLAY-OUT seq 20 permit 10.0.255.15/32
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
route-map DCI-OUT permit 10
   match ip address prefix-list DCI-OUT
!
route-map DCI-UNDERLAY-OUT permit 10
   match ip address prefix-list DCI-UNDERLAY-OUT
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65003
   router-id 10.0.250.15
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn remote-as 65000
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay remote-as 65000
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.0.1.8 peer group underlay
   neighbor 10.0.1.8 description spine1-underlay
   neighbor 10.0.2.8 peer group underlay
   neighbor 10.0.2.8 description spine2-underlay
   neighbor 10.0.250.1 peer group evpn
   neighbor 10.0.250.1 description spine1-EVPN-Lo0
   neighbor 10.0.250.2 peer group evpn
   neighbor 10.0.250.2 description spine2-EVPN-Lo0
   neighbor 10.3.250.15 remote-as 65300
   neighbor 10.3.250.15 update-source Loopback0
   neighbor 10.3.250.15 bfd
   neighbor 10.3.250.15 description dc3-border-leaf-METRO-EVPN
   neighbor 10.3.250.15 ebgp-multihop 3
   neighbor 10.3.250.15 send-community extended
   neighbor 172.16.230.1 remote-as 65300
   neighbor 172.16.230.1 description dc3-border-leaf-METRO-underlay
   neighbor 172.16.230.1 route-map DCI-UNDERLAY-OUT out
   !
   vlan 40
      rd 10.0.250.15:40
      rd evpn domain remote 10.0.250.15:10040
      route-target both 40:110040
      route-target import export evpn domain remote 40:110040
      redistribute learned
   !
   address-family evpn
      neighbor evpn activate
      neighbor 10.3.250.15 activate
      neighbor 10.3.250.15 domain remote
      domain identifier 1:1
      domain identifier 3:3 remote
   !
   address-family ipv4
      neighbor underlay activate
      neighbor 172.16.230.1 activate
      network 10.0.250.15/32
      network 10.0.255.15/32
   !
   vrf gold
      rd 10.0.250.15:1
      rd evpn domain remote 10.0.250.15:10001
      route-target import evpn domain all 1:100001
      route-target export evpn domain all 1:100001
      neighbor 172.16.100.1 remote-as 65100
      neighbor 172.16.100.1 description internet-rtr
      neighbor 172.16.200.1 remote-as 65200
      neighbor 172.16.200.1 description DC2-BL-gold
      neighbor 172.16.200.1 route-map DCI-OUT out
      !
      address-family ipv4
         neighbor 172.16.100.1 activate
         neighbor 172.16.200.1 activate
!
management ssh
   vrf MGMT
      no shutdown
!
end
