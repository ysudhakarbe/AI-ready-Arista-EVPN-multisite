! Command: show running-config
! device: leaf5 (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf5
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 40
   name APP-40
!
vlan 50
   name APP-50
!
vrf instance MGMT
!
vrf instance gold
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel10
   description SRV-1 bond0
   switchport access vlan 40
   !
   evpn ethernet-segment
      identifier 0000:0000:0000:0000:0010
      route-target import 00:00:00:00:00:10
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
   lacp system-id 0000.0000.0010
   spanning-tree portfast
   spanning-tree bpdufilter enable
!
interface Port-Channel20
   description SRV-2 bond0
   switchport access vlan 50
   !
   evpn ethernet-segment
      identifier 0000:0000:0000:0000:0020
      route-target import 00:00:00:00:00:20
   port-channel lacp fallback individual
   port-channel lacp fallback timeout 30
   lacp system-id 0000.0000.0020
   spanning-tree portfast
   spanning-tree bpdufilter enable
!
interface Ethernet1
   description SRV-1 eth1
   channel-group 10 mode active
!
interface Ethernet2
   description SRV-2 eth1
   channel-group 20 mode active
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   description spine1 Ethernet6
   mtu 9214
   no switchport
   ip address 10.0.1.15/31
!
interface Ethernet12
   description spine2 Ethernet6
   mtu 9214
   no switchport
   ip address 10.0.2.15/31
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   description EVPN router-id
   ip address 10.0.250.18/32
!
interface Loopback1
   description VTEP
   ip address 10.0.255.18/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.225/24
!
interface Vlan40
   vrf gold
   ip address virtual 10.40.40.1/24
!
interface Vlan50
   vrf gold
   ip address virtual 10.50.50.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 40 vni 110040
   vxlan vlan 50 vni 110050
   vxlan vrf gold vni 100001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65005
   router-id 10.0.250.18
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn remote-as 65000
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay remote-as 65000
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.0.1.14 peer group underlay
   neighbor 10.0.1.14 description spine1-underlay
   neighbor 10.0.2.14 peer group underlay
   neighbor 10.0.2.14 description spine2-underlay
   neighbor 10.0.250.1 peer group evpn
   neighbor 10.0.250.1 description spine1-EVPN-Lo0
   neighbor 10.0.250.2 peer group evpn
   neighbor 10.0.250.2 description spine2-EVPN-Lo0
   !
   vlan 40
      rd 10.0.250.18:40
      route-target both 40:110040
      redistribute learned
   !
   vlan 50
      rd 10.0.250.18:50
      route-target both 50:110050
      redistribute learned
   !
   address-family evpn
      neighbor evpn activate
   !
   address-family ipv4
      neighbor underlay activate
      network 10.0.250.18/32
      network 10.0.255.18/32
   !
   vrf gold
      rd 10.0.250.18:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      redistribute connected
!
management ssh
   vrf MGMT
      no shutdown
!
end
