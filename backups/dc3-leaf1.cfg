! Command: show running-config
! device: dc3-leaf1 (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc3-leaf1
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 40
   name APP-40
!
vlan 70
   name APP-70
!
vrf instance MGMT
!
vrf instance gold
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description VPC6 (VLAN 40, stretched)
   switchport access vlan 40
!
interface Ethernet2
   description VPC7 (VLAN 70, DC3 home)
   switchport access vlan 70
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   description dc3-border-leaf Ethernet1
   mtu 9214
   no switchport
   ip address 10.3.1.1/31
!
interface Ethernet12
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   description EVPN router-id
   ip address 10.3.250.11/32
!
interface Loopback1
   description VTEP
   ip address 10.3.255.11/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.229/24
!
interface Vlan40
   vrf gold
   ip address virtual 10.40.40.1/24
!
interface Vlan70
   vrf gold
   ip address virtual 10.70.70.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 40 vni 110040
   vxlan vlan 70 vni 110070
   vxlan vrf gold vni 100001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65301
   router-id 10.3.250.11
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn remote-as 65300
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay remote-as 65300
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.3.1.0 peer group underlay
   neighbor 10.3.1.0 description dc3-border-leaf-underlay
   neighbor 10.3.250.15 peer group evpn
   neighbor 10.3.250.15 description dc3-border-leaf-EVPN-Lo0
   !
   vlan 40
      rd 10.3.250.11:40
      route-target both 40:110040
      redistribute learned
   !
   vlan 70
      rd 10.3.250.11:70
      route-target both 70:110070
      redistribute learned
   !
   address-family evpn
      neighbor evpn activate
   !
   address-family ipv4
      neighbor underlay activate
      network 10.3.250.11/32
      network 10.3.255.11/32
   !
   vrf gold
      rd 10.3.250.11:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      redistribute connected
!
management ssh
   vrf MGMT
      no shutdown
!
end
