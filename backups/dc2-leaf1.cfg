! Command: show running-config
! device: dc2-leaf1 (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc2-leaf1
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 60
   name APP-60
!
vrf instance MGMT
!
vrf instance gold
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description DC2-host
   switchport access vlan 60
!
interface Ethernet2
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   description dc2-border-leaf Ethernet1
   mtu 9214
   no switchport
   ip address 10.1.1.1/31
!
interface Ethernet12
!
interface Ethernet13
!
interface Ethernet14
!
interface Loopback0
   description EVPN router-id
   ip address 10.1.250.11/32
!
interface Loopback1
   description VTEP
   ip address 10.1.255.11/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.231/24
!
interface Vlan60
   vrf gold
   ip address virtual 10.60.60.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 60 vni 110060
   vxlan vrf gold vni 100001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65201
   router-id 10.1.250.11
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn remote-as 65200
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay remote-as 65200
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.1.1.0 peer group underlay
   neighbor 10.1.1.0 description dc2-border-leaf-underlay
   neighbor 10.1.250.15 peer group evpn
   neighbor 10.1.250.15 description dc2-border-leaf-EVPN-Lo0
   !
   vlan 60
      rd 10.1.250.11:60
      route-target both 60:110060
      redistribute learned
   !
   address-family evpn
      neighbor evpn activate
   !
   address-family ipv4
      neighbor underlay activate
      network 10.1.250.11/32
      network 10.1.255.11/32
   !
   vrf gold
      rd 10.1.250.11:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      redistribute connected
!
management ssh
   vrf MGMT
      no shutdown
!
end
