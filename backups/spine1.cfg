! Command: show running-config
! device: spine1 (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine1
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description leaf1 Ethernet11
   mtu 9214
   no switchport
   ip address 10.0.1.0/31
!
interface Ethernet2
   description leaf2 Ethernet11
   mtu 9214
   no switchport
   ip address 10.0.1.2/31
!
interface Ethernet3
   description leaf3 Ethernet11
   mtu 9214
   no switchport
   ip address 10.0.1.4/31
!
interface Ethernet4
   description dc1-border-leaf Ethernet1
   mtu 9214
   no switchport
   ip address 10.0.1.8/31
!
interface Ethernet5
   description leaf4 Ethernet11
   mtu 9214
   no switchport
   ip address 10.0.1.12/31
!
interface Ethernet6
   description leaf5 Ethernet11
   mtu 9214
   no switchport
   ip address 10.0.1.14/31
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
   no switchport
   ip address 10.0.0.140/24
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   description EVPN router-id
   ip address 10.0.250.1/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.211/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65000
   router-id 10.0.250.1
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn next-hop-unchanged
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.0.1.1 peer group underlay
   neighbor 10.0.1.1 remote-as 65001
   neighbor 10.0.1.1 description leaf1-underlay
   neighbor 10.0.1.3 peer group underlay
   neighbor 10.0.1.3 remote-as 65001
   neighbor 10.0.1.3 description leaf2-underlay
   neighbor 10.0.1.5 peer group underlay
   neighbor 10.0.1.5 remote-as 65002
   neighbor 10.0.1.5 description leaf3-underlay
   neighbor 10.0.1.9 peer group underlay
   neighbor 10.0.1.9 remote-as 65003
   neighbor 10.0.1.9 description dc1-border-leaf-underlay
   neighbor 10.0.1.13 peer group underlay
   neighbor 10.0.1.13 remote-as 65004
   neighbor 10.0.1.13 description leaf4-underlay
   neighbor 10.0.1.15 peer group underlay
   neighbor 10.0.1.15 remote-as 65005
   neighbor 10.0.1.15 description leaf5-underlay
   neighbor 10.0.250.11 peer group evpn
   neighbor 10.0.250.11 remote-as 65001
   neighbor 10.0.250.11 description leaf1-EVPN-Lo0
   neighbor 10.0.250.12 peer group evpn
   neighbor 10.0.250.12 remote-as 65001
   neighbor 10.0.250.12 description leaf2-EVPN-Lo0
   neighbor 10.0.250.13 peer group evpn
   neighbor 10.0.250.13 remote-as 65002
   neighbor 10.0.250.13 description leaf3-EVPN-Lo0
   neighbor 10.0.250.15 peer group evpn
   neighbor 10.0.250.15 remote-as 65003
   neighbor 10.0.250.15 description dc1-border-leaf-EVPN-Lo0
   neighbor 10.0.250.17 peer group evpn
   neighbor 10.0.250.17 remote-as 65004
   neighbor 10.0.250.17 description leaf4-EVPN-Lo0
   neighbor 10.0.250.18 peer group evpn
   neighbor 10.0.250.18 remote-as 65005
   neighbor 10.0.250.18 description leaf5-EVPN-Lo0
   !
   address-family evpn
      neighbor evpn activate
   !
   address-family ipv4
      neighbor underlay activate
      network 10.0.250.1/32
!
management ssh
   vrf MGMT
      no shutdown
!
end
