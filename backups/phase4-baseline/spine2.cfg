! Command: show running-config
! device: spine2 (vEOS-lab, EOS-4.31.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine2
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description leaf1
   mtu 9214
   no switchport
   ip address 10.0.2.0/31
!
interface Ethernet2
   description leaf2
   mtu 9214
   no switchport
   ip address 10.0.2.2/31
!
interface Ethernet3
   description leaf3
   mtu 9214
   no switchport
   ip address 10.0.2.4/31
!
interface Ethernet4
   description border-leaf
   mtu 9214
   no switchport
   ip address 10.0.2.8/31
!
interface Ethernet5
   description leaf4
   mtu 9214
   no switchport
   ip address 10.0.2.12/31
!
interface Ethernet6
   description leaf5
   mtu 9214
   no switchport
   ip address 10.0.2.14/31
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
   no switchport
   ip address 10.0.0.141/24
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   ip address 10.0.250.2/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.212/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65000
   router-id 10.0.250.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn next-hop-unchanged
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn route-reflector-client
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor 10.0.2.1 remote-as 65001
   neighbor 10.0.2.3 remote-as 65001
   neighbor 10.0.2.5 remote-as 65002
   neighbor 10.0.2.7 remote-as 65002
   neighbor 10.0.2.9 remote-as 65003
   neighbor 10.0.2.11 remote-as 65003
   neighbor 10.0.2.13 remote-as 65004
   neighbor 10.0.2.15 remote-as 65005
   neighbor 10.0.250.11 peer group evpn
   neighbor 10.0.250.11 remote-as 65001
   neighbor 10.0.250.12 peer group evpn
   neighbor 10.0.250.12 remote-as 65001
   neighbor 10.0.250.13 peer group evpn
   neighbor 10.0.250.13 remote-as 65002
   neighbor 10.0.250.14 peer group evpn
   neighbor 10.0.250.14 remote-as 65002
   neighbor 10.0.250.15 peer group evpn
   neighbor 10.0.250.15 remote-as 65003
   neighbor 10.0.250.16 peer group evpn
   neighbor 10.0.250.16 remote-as 65003
   neighbor 10.0.250.17 peer group evpn
   neighbor 10.0.250.17 remote-as 65004
   neighbor 10.0.250.18 peer group evpn
   neighbor 10.0.250.18 remote-as 65005
   !
   address-family evpn
      neighbor evpn activate
      neighbor 10.0.250.11 activate
      neighbor 10.0.250.12 activate
      neighbor 10.0.250.13 activate
      neighbor 10.0.250.14 activate
      neighbor 10.0.250.15 activate
      neighbor 10.0.250.16 activate
      neighbor 10.0.250.17 activate
      neighbor 10.0.250.18 activate
   !
   address-family ipv4
      neighbor 10.0.2.1 activate
      neighbor 10.0.2.3 activate
      neighbor 10.0.2.5 activate
      neighbor 10.0.2.7 activate
      neighbor 10.0.2.9 activate
      neighbor 10.0.2.11 activate
      neighbor 10.0.2.13 activate
      neighbor 10.0.2.15 activate
      network 10.0.250.2/32
!
management ssh
   vrf MGMT
      no shutdown
!
end

