! Command: show running-config
! device: dc3-border-leaf (vEOS-lab, EOS-4.36.3M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username monitor role network-operator secret sha512 <redacted>
username salt privilege 15 role network-admin secret sha512 <redacted>
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname dc3-border-leaf
ip name-server vrf MGMT 1.1.1.1
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 40
   name APP-40
!
vrf instance MGMT
!
vrf instance gold
!
interface Ethernet1
   description dc3-leaf1 Ethernet11
   mtu 9214
   no switchport
   ip address 10.3.1.0/31
!
interface Ethernet2
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
   description METRO-EVPN-DCI-to-DC1-border-leaf Ethernet5
   mtu 9214
   no switchport
   ip address 172.16.230.1/31
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
!
interface Ethernet12
!
interface Ethernet13
!
interface Ethernet14
!
interface Ethernet15
!
interface Ethernet16
!
interface Ethernet17
!
interface Ethernet18
!
interface Ethernet19
!
interface Loopback0
   description EVPN router-id
   ip address 10.3.250.15/32
!
interface Loopback1
   description VTEP
   ip address 10.3.255.15/32
!
interface Loopback100
   description VRF gold anchor / diagnostic
   vrf gold
   ip address 10.3.100.1/32
!
interface Management1
   description OOB-to-home-LAN
   vrf MGMT
   ip address 192.168.1.228/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 40 vni 110040
   vxlan vrf gold vni 100001
!
ip routing
no ip routing vrf MGMT
ip routing vrf gold
!
ip prefix-list DCI-UNDERLAY-OUT seq 10 permit 10.3.250.15/32
ip prefix-list DCI-UNDERLAY-OUT seq 20 permit 10.3.255.15/32
!
ip route vrf MGMT 0.0.0.0/0 192.168.1.254
!
route-map DCI-UNDERLAY-OUT permit 10
   match ip address prefix-list DCI-UNDERLAY-OUT
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65300
   router-id 10.3.250.15
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 64
   neighbor evpn peer group
   neighbor evpn update-source Loopback0
   neighbor evpn bfd
   neighbor evpn ebgp-multihop 3
   neighbor evpn send-community extended
   neighbor evpn maximum-routes 12000 warning-only
   neighbor underlay peer group
   neighbor underlay maximum-routes 12000 warning-only
   neighbor 10.0.250.15 remote-as 65003
   neighbor 10.0.250.15 update-source Loopback0
   neighbor 10.0.250.15 bfd
   neighbor 10.0.250.15 description DC1-border-leaf-METRO-EVPN
   neighbor 10.0.250.15 ebgp-multihop 3
   neighbor 10.0.250.15 send-community extended
   neighbor 10.3.1.1 peer group underlay
   neighbor 10.3.1.1 remote-as 65301
   neighbor 10.3.1.1 description dc3-leaf1-underlay
   neighbor 10.3.250.11 peer group evpn
   neighbor 10.3.250.11 remote-as 65301
   neighbor 10.3.250.11 description dc3-leaf1-EVPN-Lo0
   neighbor 172.16.230.0 remote-as 65003
   neighbor 172.16.230.0 description DC1-border-leaf-METRO-underlay
   neighbor 172.16.230.0 route-map DCI-UNDERLAY-OUT out
   !
   vlan 40
      rd 10.3.250.15:40
      rd evpn domain remote 10.3.250.15:10040
      route-target both 40:110040
      route-target import export evpn domain remote 40:110040
      redistribute learned
   !
   address-family evpn
      neighbor evpn activate
      neighbor 10.0.250.15 activate
      neighbor 10.0.250.15 domain remote
      domain identifier 3:3
      domain identifier 1:1 remote
   !
   address-family ipv4
      neighbor underlay activate
      neighbor 172.16.230.0 activate
      network 10.3.250.15/32
      network 10.3.255.15/32
   !
   vrf gold
      rd 10.3.250.15:1
      rd evpn domain remote 10.3.250.15:10001
      route-target import evpn domain all 1:100001
      route-target export evpn domain all 1:100001
      redistribute connected
!
management ssh
   vrf MGMT
      no shutdown
!
end
